[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain==1.4.2",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.5",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typing-extensions>=4.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
