services:
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=your-secret-token-at-least-32-chars
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./nacos-data:/home/nacos/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hucoo_agent_platform
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  # RustFS：S3 兼容对象存储，作为 MinIO 的替代（Apache 2.0，1.0 GA）。
  # 镜像以非 root 用户 rustfs（UID/GID 10001）运行，bind mount 前必须先 chown，
  # 因此这里用一个一次性的 perms 服务完成授权。
  rustfs-perms:
    image: alpine:3.20
    container_name: rustfs-perms
    command: chown -R 10001:10001 /data
    volumes:
      - ./rustfs-data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    command: ["/data"]
    environment:
      # 默认凭证 rustfsadmin/rustfsadmin 官方不推荐，这里显式覆盖
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-hucoo-local-ak}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-hucoo-local-sk}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_REGION=us-east-1
      - RUSTFS_OBS_LOGGER_LEVEL=error
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - ./rustfs-data:/data
