spring:
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
  datasource:
    url: ${HUCOO_DB_URL:jdbc:postgresql://127.0.0.1:5432/hucoo_agent_platform}
    driver-class-name: org.postgresql.Driver
    username: ${HUCOO_DB_USERNAME:postgres}
    password: ${HUCOO_DB_PASSWORD:postgres}
  flyway:
    enabled: true

agent-platform:
  persistence:
    enabled: true
  model-governance:
    vault:
      key-id: ${HUCOO_MODEL_VAULT_KEY_ID:model-master}
      active-version: v1
      keys:
        # Base64 编码的 32 字节随机主密钥；历史版本密钥由安全配置中心保留。
        v1: ${HUCOO_MODEL_VAULT_KEY_V1:}
  # 生产强制对象存储：本地文件系统不共享，多实例部署会读到不同的文件
  storage:
    type: s3
    auto-create-bucket: false
    s3:
      endpoint: ${HUCOO_S3_ENDPOINT}
      public-endpoint: ${HUCOO_S3_PUBLIC_ENDPOINT:${HUCOO_S3_ENDPOINT}}
      region: ${HUCOO_S3_REGION:us-east-1}
      access-key: ${HUCOO_S3_ACCESS_KEY}
      secret-key: ${HUCOO_S3_SECRET_KEY}
      path-style-access: true
      chunked-encoding-enabled: false
  modules:
    file:
      signed-url-secret: ${HUCOO_FILE_SIGNED_URL_SECRET}
      signed-url-base: ${HUCOO_FILE_SIGNED_URL_BASE:}
  security:
    enabled: true
    jwt-secret: ${HUCOO_JWT_SECRET}
    jwt-key-id: ${HUCOO_JWT_KEY_ID:prod-v1}
  authentication:
    enabled: true
    access-token-ttl-minutes: 20
    refresh-token-ttl-days: 30
    verification-code-ttl-seconds: 300
    login-failure-threshold: 5
    login-lock-minutes: 15
    jwt-key-id: ${HUCOO_JWT_KEY_ID:prod-v1}
    providers:
      password: true
      sms: ${HUCOO_AUTH_SMS_ENABLED:false}
      email: ${HUCOO_AUTH_EMAIL_ENABLED:false}
      wechat: ${HUCOO_AUTH_WECHAT_ENABLED:false}
      qq: ${HUCOO_AUTH_QQ_ENABLED:false}
  cache:
    type: caffeine

management:
  health:
    db:
      enabled: true
    storage:
      enabled: true
    nacos:
      discovery:
        enabled: true
    nacos-config:
      enabled: true
