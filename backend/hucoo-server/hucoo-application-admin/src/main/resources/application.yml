server:
  port: 8081
  tomcat:
    threads:
      virtual:
        enabled: true
    # 上传中断时 Tomcat 需要吞掉剩余请求体，否则连接被重置
    max-swallow-size: 210MB
  shutdown: graceful

spring:
  application:
    name: hucoo-application-admin
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      # 超过阈值落磁盘临时文件，避免大文件进堆内存
      file-size-threshold: 2MB
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import:
      - optional:nacos:hucoo-application-admin.yml
      - optional:nacos:common.yml
  cloud:
    nacos:
      server-addr: 111.229.41.236:8848
      username: nacos
      password: 123naco
      discovery:
        namespace: ec193d05-b29c-4d7d-9261-56801a60cdc4
        group: DEFAULT_GROUP
        naming-cache-persist: true
      config:
        namespace: ec193d05-b29c-4d7d-9261-56801a60cdc4
        group: DEFAULT_GROUP
        file-extension: yml
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  datasource:
    url: ${HUCOO_DB_URL:jdbc:postgresql://127.0.0.1:5432/hucoo_agent_platform}
    driver-class-name: org.postgresql.Driver
    username: ${HUCOO_DB_USERNAME:postgres}
    password: ${HUCOO_DB_PASSWORD:postgres}
    hikari:
      pool-name: HucooAgentPlatformHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: caffeine
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: dev.hucoo.*.domain.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

agent-platform:
  persistence:
    enabled: false
  # 对象存储：s3（RustFS/MinIO/AWS S3/OSS）| local（本地文件系统，仅单机）| memory（仅测试）
  # 生产 profile 强制 s3：本地存储不共享，多实例部署会读到不同的文件
  storage:
    enabled: true
    type: ${HUCOO_FILE_STORAGE_TYPE:local}
    default-bucket: ${HUCOO_FILE_BUCKET:hucoo-files}
    key-prefix: files
    simple-upload-threshold: 8MB
    part-size: 8MB
    max-file-size: 200MB
    presign-ttl: 10m
    upload-session-ttl: 24h
    auto-create-bucket: true
    local:
      root: ${HUCOO_FILE_LOCAL_ROOT:./data/files}
      create-dirs: true
    s3:
      endpoint: ${HUCOO_S3_ENDPOINT:http://127.0.0.1:9000}
      # 签发给浏览器的地址必须是对外可达地址，且与访问时的 host/scheme/port 完全一致
      public-endpoint: ${HUCOO_S3_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
      region: ${HUCOO_S3_REGION:us-east-1}
      access-key: ${HUCOO_S3_ACCESS_KEY:hucoo-local-ak}
      secret-key: ${HUCOO_S3_SECRET_KEY:hucoo-local-sk}
      path-style-access: true
      chunked-encoding-enabled: false
      connection-timeout: 3s
      socket-timeout: 60s
      max-connections: 64
  security:
    enabled: false
    jwt-secret: ${HUCOO_JWT_SECRET:hucoo-agent-platform-local-secret-please-change}
    jwt-key-id: ${HUCOO_JWT_KEY_ID:local-v1}
    token-ttl-minutes: 20
  swagger:
    enabled: true
    title: Hucoo Agent Platform Admin API
    description: Agent 平台管理端接口文档
    version: v1
  authentication:
    enabled: true
    access-token-ttl-minutes: 20
    refresh-token-ttl-days: 30
    verification-code-ttl-seconds: 300
    max-verification-attempts: 5
    login-failure-threshold: 5
    login-lock-minutes: 15
    jwt-key-id: ${HUCOO_JWT_KEY_ID:local-v1}
    providers:
      password: true
      sms: false
      email: false
      wechat: false
      qq: false
  modules:
    file:
      enabled: true
      max-file-size: 200MB
      download-audit-enabled: true
      signed-url-ttl: 10m
      signed-url-secret: ${HUCOO_FILE_SIGNED_URL_SECRET:hucoo-file-signed-url-local-secret-please-change}
      # 生成绝对下载地址用；留空返回相对路径
      signed-url-base: ${HUCOO_FILE_SIGNED_URL_BASE:}
    audit:
      enabled: true
      operation-log:
        enabled: true
        include-read-operations: false
        retention-days: 180
        queue-capacity: 10000
        retention-cron: 0 0 3 * * *
  cache:
    type: caffeine
    ttl-minutes: 30
  integration:
    git:
      base-url: http://127.0.0.1:9999
  model-runtime:
    enabled: true
    # 开启后通过进程内治理 Facade 读取当前登录身份可调用的已发布路由及加密凭证。
    persistence-enabled: ${HUCOO_MODEL_RUNTIME_PERSISTENCE:false}
    open-code-go-user-agent: ${HUCOO_OPENCODE_GO_USER_AGENT:hucoo-agent-platform/1.0}
    max-attempts: 3
    connect-timeout: 2s
    response-timeout: 30s
    stream-idle-timeout: 60s
    route-cache-ttl: 30s
    circuit-failure-threshold: 5
    circuit-window-seconds: 60
    circuit-open-seconds: 30
    low-balance-factor: 0.5
  model-governance:
    vault:
      key-id: ${HUCOO_MODEL_VAULT_KEY_ID:model-master}
      active-version: v1
      keys:
        # Base64 编码的 32 字节随机主密钥；历史版本密钥由安全配置中心保留。
        v1: ${HUCOO_MODEL_VAULT_KEY_V1:MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false
    redis:
      enabled: false
    storage:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${agent-platform.swagger.enabled:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: ${agent-platform.swagger.enabled:true}
    path: /v3/api-docs
