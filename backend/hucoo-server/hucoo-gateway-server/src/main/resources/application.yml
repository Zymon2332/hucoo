server:
  port: 8080

spring:
  application:
    name: hucoo-gateway-server
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:hucoo-gateway-server.yml
      - optional:nacos:common.yml
  cloud:
    nacos:
      server-addr: 111.229.41.236:8848
      username: nacos
      password: 123naco
      discovery:
        namespace: ec193d05-b29c-4d7d-9261-56801a60cdc4
        group: DEFAULT_GROUP
        naming-cache-persist: true
      config:
        namespace: ec193d05-b29c-4d7d-9261-56801a60cdc4
        group: DEFAULT_GROUP
        file-extension: yml
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Gateway-Node, hucoo-gateway-server # 全局加响应头
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: public-model-catalog-route
              uri: lb://hucoo-application-admin
              predicates:
                - Path=/api/v1/model-catalog
            - id: admin-route
              uri: lb://hucoo-application-admin
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2
            - id: model-runtime-route
              uri: lb://hucoo-model-runtime
              predicates:
                - Path=/api/model/**
              filters:
                - StripPrefix=2
            - id: agent
              uri: lb://agent
              predicates:
                - Path=/api/agent/**
              filters:
                - StripPrefix=2
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

agent-platform:
  gateway:
    auth:
      enabled: false
      token-header: Authorization
      whitelist:
        - /actuator/**
        - /api/admin/v1/public/**
        - /api/admin/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
